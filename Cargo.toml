[package]
name = "cat-bot"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Ang2Tea/cat-bot"
readme = "README.md"

[features]
default = []
sqlx = ["dep:sqlx"]
diesel=["dep:diesel", "dep:diesel-async"]
postgres = ["diesel-async/postgres", "sqlx/postgres"] 


[[bin]]
name = "cat-bot"
path = "src/bin/shuttle/main.rs"
required-features = ["sqlx", "postgres"]

[[bin]]
name = "standalone"
path = "src/bin/standalone.rs"


[dependencies]
# Async
futures = "0.3.31"
tokio = { version = "1.45.1", features = ["full"] }

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# Telegram API
teloxide = { version = "0.17.0", features = ["macros"] }

# HTTP Client
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.12.19", features = ["json", "blocking"] }

# Databases
sqlx = { version = "0.8.6", optional = true, features = ["runtime-tokio"] }
diesel = { version = "2.2.12", optional = true }
diesel-async = { version = "0.6.1", optional = true }

# Utils
thiserror = "2.0.17"
dotenvy = "0.15.7"

# Shuttle
shuttle-runtime = { version = "0.57.0", features = ["tracing-subscriber"] }
shuttle-shared-db = { version = "0.57.0", features = ["postgres", "sqlx", "diesel-async"] }
