[package]
name = "cat-bot-shuttle"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Ang2Tea/cat-bot"
readme = "README.md"

[dependencies]
tracing = { workspace = true }

sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }

shuttle-runtime = { version = "0.57.0", features = ["tracing-subscriber"] }
shuttle-shared-db = { version = "0.57.0", features = ["postgres", "sqlx"] }

cat-bot = { path="../cat-bot" }
cat-bot-databases = { path = "../cat-bot-databases", features = ["sqlx", "postgres"]}
cat-bot-adapters = { path="../cat-bot-adapters" }
